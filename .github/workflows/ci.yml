name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Ubuntu runners have no D-Bus session, so AutoKeystore probes the
    # libsecret keyring, fails, and falls back to the age-encrypted file
    # keystore — which requires VEIL_PASSPHRASE. Integration tests strip
    # VEIL_TEST_KEYSTORE on purpose so they exercise the real production
    # chain end-to-end, so the passphrase must be present in the workflow
    # env. macOS Keychain doesn't need this but the var is harmless there.
    env:
      VEIL_PASSPHRASE: ci-test-passphrase-not-secret
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: make vet

      - name: tests
        run: make test

      - name: tests (race)
        run: make test-race

  test-integration:
    name: test-integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The integration target runs the production keystore path (no -tags
    # testkeystore, no VEIL_TEST_KEYSTORE=mem). The passphrase is harmless on
    # macOS (Keychain doesn't read it) and is required on Linux if the
    # keyring probe fails and we fall through to the file-keystore fallback.
    env:
      VEIL_PASSPHRASE: ci-test-passphrase-not-secret
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install gnome-keyring (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring

      - name: tests (integration, linux)
        if: matrix.os == 'ubuntu-latest'
        # Run dbus and gnome-keyring-daemon under dbus-run-session so they
        # are guaranteed alive for the entire test invocation. Earlier
        # versions started the daemon in a separate step and propagated
        # env vars via $GITHUB_ENV, which proved unreliable on hosted
        # runners — the daemon could die between steps and the test job
        # would silently fall through to the file-keystore fallback,
        # masking real Linux keyring regressions.
        #
        # VEIL_REQUIRE_KEYRING=1 instructs the backend-selection test in
        # internal/vault/keystore_integration_test.go to FAIL if AutoKeystore
        # ever returns the file fallback on Linux CI. That turns a silent
        # degraded mode into a loud failure.
        env:
          VEIL_REQUIRE_KEYRING: "1"
        run: |
          dbus-run-session -- bash -c '
            echo -n "$VEIL_PASSPHRASE" | gnome-keyring-daemon --unlock
            eval "$(echo -n "$VEIL_PASSPHRASE" | gnome-keyring-daemon --start --components=secrets)"
            make test-integration
          '

      - name: tests (integration, macos)
        if: matrix.os == 'macos-latest'
        run: make test-integration

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-compile all targets
        run: make xbuild
