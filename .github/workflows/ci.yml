name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Ubuntu runners have no D-Bus session, so AutoKeystore probes the
    # libsecret keyring, fails, and falls back to the age-encrypted file
    # keystore — which requires VEIL_PASSPHRASE. Integration tests strip
    # VEIL_TEST_KEYSTORE on purpose so they exercise the real production
    # chain end-to-end, so the passphrase must be present in the workflow
    # env. macOS Keychain doesn't need this but the var is harmless there.
    env:
      VEIL_PASSPHRASE: ci-test-passphrase-not-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: make vet

      - name: tests
        run: make test

      - name: tests (race)
        run: make test-race

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-compile all targets
        run: make xbuild
